services:
  postgres:
    image: postgres:15-alpine
    container_name: agendamento-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_DATABASE:-agendamento}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5

  back:
    build:
      context: ./back
      dockerfile: Dockerfile
      target: development
    container_name: agendamento-back
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: development
      PORT: 3333
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_DATABASE: ${DB_DATABASE:-agendamento}
      TYPEORM_SYNCHRONIZE: 'false'
      TYPEORM_LOGGING: 'false'
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      TIMEZONE: America/Sao_Paulo
      JWT_SECRET: ${JWT_SECRET:-change-me-in-development-only}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
    ports:
      - '${BACK_PORT:-3333}:3333'
    volumes:
      - ./back:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  front:
    build:
      context: ./front
      dockerfile: Dockerfile
      target: development
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3333}
    container_name: agendamento-front
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3333}
    ports:
      - '${FRONT_PORT:-3000}:3000'
    volumes:
      - ./front:/app
      - /app/node_modules
    depends_on:
      - back

volumes:
  postgres_data:
